[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rml-cnn"
version = "0.1.0"
description = "CNN-based source classification for the RadioML 2016.10a dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
torch = ["torch>=2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
